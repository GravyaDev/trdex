[project]
name = "trdex"
version = "0.1.0"
description = "Trading automation platform — crypto, FX, and multi-asset"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Daniele", email = "daniele@gravya.it" },
]

dependencies = [
    "ccxt>=4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "redis>=5.0",
    "pandas>=2.2",
    "numpy>=1.26",
    # Phase 2 — AI Agent System
    "langgraph>=0.2",
    # LLM provider adapters (Task 1 — llm-agents branch)
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-google-genai>=2.0",
    # Telegram signal following
    "telethon>=1.36",
    "langchain-core>=0.2",
    "qdrant-client>=1.9",
    "polars==1.33.1",           # lts-cpu variant required on Windows (cpu-check VirtualAlloc issue)
    "httpx>=0.27",
    "streamlit>=1.56.0",
    "plotly>=6.6.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",           # TestClient for FastAPI
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trdex"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["trdex"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ccxt.*", "redis.*", "langgraph.*", "langchain_core.*", "langchain_anthropic.*", "langchain_openai.*", "langchain_google_genai.*", "qdrant_client.*", "polars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/trdex"]
omit = ["tests/*"]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
]
