opencliVersion: 1.0.0-alpha.7
info:
  title: Claudify
  binary: claudify
  version: 1.0.0
  description: Professional operating system for Claude Code — memory, commands, agents, and hooks.

global:
  exitCodes:
    - code: 0
      summary: Command completed successfully
    - code: 1
      summary: Command failed or missing prerequisites

commands:

  # ── Daily Rituals ──────────────────────────────────────────────────────────

  claudify start [flags]:
    summary: Begin a working session — load memory, create daily note, review tasks
    flags:
      - name: quick
        type: boolean
        summary: Run standup mode instead of full start
        aliases: [q]

  claudify sync [flags]:
    summary: Mid-day refresh — update memory, process scratchpad, review tasks
    flags:
      - name: force
        type: boolean
        summary: Force sync even if done recently
        aliases: [f]

  claudify wrap-up [flags]:
    summary: End-of-day — audit, externalize knowledge, prep tomorrow
    flags:
      - name: skip-audit
        type: boolean
        summary: Skip the quality audit step

  claudify standup [flags]:
    summary: Quick daily standup — yesterday/today/blockers from git and tasks
    flags:
      - name: format
        type: string
        summary: Output format
        choices: [text, markdown, slack]
        default: text

  claudify clear [flags]:
    summary: Distill session state and flush context to resume fresh
    flags:
      - name: emergency
        type: boolean
        summary: Emergency mode — skip distillation, reset immediately
        aliases: [e]

  # ── Quality & Review ───────────────────────────────────────────────────────

  claudify audit [scope] [flags]:
    summary: Delegate quality review to the auditor agent
    arguments:
      - name: scope
        type: string
        summary: What to audit (e.g. last-task, filename, feature name)
        required: false

  claudify review [target] [flags]:
    summary: Deep code review — security, performance, architecture
    arguments:
      - name: target
        type: string
        summary: File, directory, or PR to review
        required: false
    flags:
      - name: focus
        type: string
        summary: Review focus area
        choices: [security, performance, architecture, all]
        default: all

  claudify system-audit [flags]:
    summary: Deep infrastructure audit of the entire Claudify system
    flags:
      - name: output
        type: string
        summary: Where to write the audit report
        default: .claude/logs/system-audit.md

  claudify drift-detect [flags]:
    summary: Detect config drift — stale rules, contradictions, orphaned files
    flags:
      - name: fix
        type: boolean
        summary: Automatically fix minor drift issues

  claudify retro [period] [flags]:
    summary: Sprint retrospective — analyze patterns, improve process
    arguments:
      - name: period
        type: string
        summary: Period to review (e.g. last-week, last-sprint)
        required: false
        default: last-week

  claudify debt-map [dir] [flags]:
    summary: Map and prioritise technical debt across the codebase
    arguments:
      - name: dir
        type: string
        summary: Directory to scan (defaults to project root)
        required: false

  # ── Problem Solving ────────────────────────────────────────────────────────

  claudify unstick [problem] [flags]:
    summary: Root-cause analysis via the unsticker agent — get unstuck fast
    arguments:
      - name: problem
        type: string
        summary: Brief description of what you're stuck on
        required: false

  claudify onboard [project] [flags]:
    summary: Generate a full codebase onboarding guide
    arguments:
      - name: project
        type: string
        summary: Project name or path to onboard (defaults to current directory)
        required: false
    flags:
      - name: depth
        type: string
        summary: Onboarding depth
        choices: [quick, full]
        default: full

  # ── Planning & Strategy ────────────────────────────────────────────────────

  claudify brief [idea] [flags]:
    summary: Turn a rough idea into a structured project brief
    arguments:
      - name: idea
        type: string
        summary: The idea or project concept to brief
        required: false
    flags:
      - name: output
        type: string
        summary: Output file path
        default: briefs/<project-name>-brief.md

  claudify launch [product] [flags]:
    summary: Full launch pipeline — competitive scan to go-to-market checklist
    arguments:
      - name: product
        type: string
        summary: Product or feature being launched
        required: false

  claudify proposal [project] [flags]:
    summary: Generate a structured client proposal with scope and pricing
    arguments:
      - name: project
        type: string
        summary: Project name or brief to base the proposal on
        required: false

  claudify competitive-intel [market] [flags]:
    summary: Deep competitive analysis with strategic recommendations
    arguments:
      - name: market
        type: string
        summary: Market or space to analyze
        required: false
    flags:
      - name: depth
        type: string
        summary: Research depth
        choices: [surface, deep]
        default: deep

  # ── Communication & Delivery ───────────────────────────────────────────────

  claudify report [topic] [flags]:
    summary: Generate an audience-aware professional report from findings
    arguments:
      - name: topic
        type: string
        summary: Topic or data set to report on
        required: false
    flags:
      - name: audience
        type: string
        summary: Target audience
        choices: [technical, executive, client]
        default: technical

  claudify release [version] [flags]:
    summary: Auto-generate release notes — technical, marketing, and executive
    arguments:
      - name: version
        type: string
        summary: Version being released (e.g. v1.2.0)
        required: false
    flags:
      - name: format
        type: string
        summary: Output format
        choices: [markdown, changelog, github]
        default: markdown

  claudify handoff [recipient] [flags]:
    summary: Structured session handoff with full context briefing
    arguments:
      - name: recipient
        type: string
        summary: Who or what is receiving the handoff (person name or AI)
        required: false

  # ── System Building ────────────────────────────────────────────────────────

  claudify playbook [name] [flags]:
    summary: Record a workflow and auto-generate a reusable command
    arguments:
      - name: name
        type: string
        summary: Name for the new playbook/command
        required: false

  claudify scaffold-cli [binary] [flags]:
    summary: Design and scaffold a CLI tool using the OpenCLI spec-first approach
    arguments:
      - name: binary
        type: string
        summary: Binary name or project description for the CLI tool
        required: false
    flags:
      - name: framework
        type: string
        summary: CLI framework to generate code for
        choices: [urfavecli, yargs]
        default: urfavecli
      - name: module-type
        type: string
        summary: JavaScript module type (yargs only)
        choices: [commonjs, esm]
        default: commonjs
