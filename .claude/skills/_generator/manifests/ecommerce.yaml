  - Customer Lifetime Value
  - Return Rate
  - Inventory Turnover

best_practices:
  - Optimize for mobile first (60%+ of traffic)
  - Reduce checkout steps (3 max)
  - Show social proof near buy buttons
  - Free shipping threshold above AOV
  - Abandoned cart emails within 1 hour

