label: "Education & Training"

frameworks:
  - Bloom's Taxonomy
  - ADDIE (Analyze, Design, Develop, Implement, Evaluate)
  - Kirkpatrick Four Levels
  - Backwards Design
  - Universal Design for Learning
  - Spaced Repetition

metrics:
  - Completion Rate
  - Assessment Scores
  - Knowledge Retention
  - Learner Satisfaction
  - Time to Competency
  - Application Rate (on-the-job)

best_practices:
  - Start with learning objectives (what will they DO)
  - Chunk content into 5-7 minute segments
  - Mix modalities (read, watch, do, discuss)
  - Assessment aligned to objectives
  - Follow up at 30, 60, 90 days for retention

