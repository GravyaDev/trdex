# documentation: https://github.com/GravyaDev/trdex
# slogan: AI-driven trading automation platform (scout, analyst, risk, executor)
# tags: trading,ai,langgraph,crypto,backtest,timescaledb,qdrant
# port: 8000

# Shared logging configuration — caps every container's log file at 10 MB
# with up to 3 rotated files, so a long-running unattended deploy on a
# small VPS disk does not silently fill the filesystem with stdout/stderr.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-trdex}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (openssl rand -hex 24)}'
      POSTGRES_DB: '${POSTGRES_DB:-trdex}'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trdex}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.13.0
    volumes:
      - qdrant:/qdrant/storage
    healthcheck:
      # The qdrant image has no curl/wget/nc. Bash is available though,
      # so we use the /dev/tcp bash trick to probe that port 6333 is
      # open. This doesn't check the /healthz endpoint body, but if
      # the TCP port is accepting connections qdrant is ready for
      # clients. CMD-SHELL default is /bin/sh (dash) which lacks
      # /dev/tcp support, so we force bash explicitly.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  app:
    build: .
    ports:
      - "${TRDEX_APP_HOST_PORT:-8500}:8000"
    environment:
      # App mode
      TRDEX_MODE: '${TRDEX_MODE:-simulation}'
      TRDEX_LOG_LEVEL: '${TRDEX_LOG_LEVEL:-INFO}'
      # Database (internal network, URL composed from POSTGRES_* vars)
      DATABASE_URL: 'postgresql+asyncpg://${POSTGRES_USER:-trdex}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trdex}'
      # Redis (internal network)
      REDIS_URL: 'redis://redis:6379/0'
      # Qdrant (internal network)
      TRDEX_QDRANT_URL: 'http://qdrant:6333'
      # FastAPI
      TRDEX_API_HOST: '0.0.0.0'
      TRDEX_API_PORT: '8000'
      # TRDEX_API_KEY: empty string is valid in dev mode (disables auth).
      # Use `?` (not `:?`) so Compose fails only if the variable is unset
      # in production Coolify — but tolerates the empty dev-locale value.
      TRDEX_API_KEY: '${TRDEX_API_KEY?TRDEX_API_KEY must be defined (can be empty in dev; generate with openssl rand -hex 32 for prod)}'
      TRDEX_CORS_ORIGINS: '${TRDEX_CORS_ORIGINS:-}'
      # Exchange (Binance) — optional in simulation mode
      BINANCE_API_KEY: '${BINANCE_API_KEY:-}'
      BINANCE_API_SECRET: '${BINANCE_API_SECRET:-}'
      # Market data aggregators — all optional
      TRDEX_COINGECKO_API_KEY: '${TRDEX_COINGECKO_API_KEY:-}'
      TRDEX_FOREX_API_KEY: '${TRDEX_FOREX_API_KEY:-}'
      TRDEX_CRYPTOCOMPARE_API_KEY: '${TRDEX_CRYPTOCOMPARE_API_KEY:-}'
      TRDEX_ALPHAVANTAGE_API_KEY: '${TRDEX_ALPHAVANTAGE_API_KEY:-}'
      TRDEX_FREECRYPTOAPI_KEY: '${TRDEX_FREECRYPTOAPI_KEY:-}'
      TRDEX_STOCKDATA_API_KEY: '${TRDEX_STOCKDATA_API_KEY:-}'
      # News ingestion
      TRDEX_INGESTION_INTERVAL: '${TRDEX_INGESTION_INTERVAL:-300}'
      TRDEX_INGESTION_SYMBOLS: '${TRDEX_INGESTION_SYMBOLS:-BTC/USDT,ETH/USDT,SOL/USDT,BNB/USDT,XRP/USDT,ADA/USDT,AVAX/USDT,DOT/USDT,LINK/USDT,UNI/USDT,AAVE/USDT,MKR/USDT,ARB/USDT,OP/USDT,MATIC/USDT,FET/USDT,RNDR/USDT,DOGE/USDT,PEPE/USDT,AXS/USDT,SAND/USDT,IMX/USDT,GALA/USDT,NEAR/USDT,ATOM/USDT}'
      # AI / embeddings (required for Qdrant context ingestion)
      # TRDEX_JINA_API_KEY: empty is tolerated (Qdrant embeddings feature
      # degrades but app still runs). `?` (not `:?`) for the same reason
      # as TRDEX_API_KEY: enforce definition in Coolify, tolerate empty dev.
      TRDEX_JINA_API_KEY: '${TRDEX_JINA_API_KEY?TRDEX_JINA_API_KEY must be defined (can be empty; enables Qdrant embeddings when set)}'
      # LLM provider API keys (llm-agents branch — all optional, empty = LLM disabled)
      TRDEX_ANTHROPIC_API_KEY: '${TRDEX_ANTHROPIC_API_KEY:-}'
      TRDEX_OPENAI_API_KEY: '${TRDEX_OPENAI_API_KEY:-}'
      TRDEX_GOOGLE_API_KEY: '${TRDEX_GOOGLE_API_KEY:-}'
      TRDEX_LLM_DAILY_BUDGET: '${TRDEX_LLM_DAILY_BUDGET:-20.0}'
      TRDEX_LLM_MONTHLY_BUDGET: '${TRDEX_LLM_MONTHLY_BUDGET:-500.0}'
      TRDEX_LLM_MAX_PROMPT_TOKENS: '${TRDEX_LLM_MAX_PROMPT_TOKENS:-4096}'
      # Telegram — disabled by default for Phase 2. A persistent volume
      # will be added when telegram signal tracking is re-enabled.
      TRDEX_TELEGRAM_API_ID: '${TRDEX_TELEGRAM_API_ID:-0}'
      TRDEX_TELEGRAM_API_HASH: '${TRDEX_TELEGRAM_API_HASH:-}'
      TRDEX_TELEGRAM_PHONE: '${TRDEX_TELEGRAM_PHONE:-}'
      TRDEX_TELEGRAM_CHANNELS: '${TRDEX_TELEGRAM_CHANNELS:-}'
      TRDEX_TELEGRAM_SIGNAL_BUDGET: '${TRDEX_TELEGRAM_SIGNAL_BUDGET:-100.0}'
      # Agent scheduler — Phase 2 observation (set true to enable)
      TRDEX_AGENT_SCHEDULER_ENABLED: '${TRDEX_AGENT_SCHEDULER_ENABLED:-false}'
      TRDEX_AGENT_SCHEDULER_INTERVAL: '${TRDEX_AGENT_SCHEDULER_INTERVAL:-300}'
      TRDEX_AGENT_SCHEDULER_SYMBOLS: '${TRDEX_AGENT_SCHEDULER_SYMBOLS:-BTC/USDT,ETH/USDT,SOL/USDT,BNB/USDT,XRP/USDT,ADA/USDT,AVAX/USDT,DOT/USDT,LINK/USDT,UNI/USDT,AAVE/USDT,MKR/USDT,ARB/USDT,OP/USDT,MATIC/USDT,FET/USDT,RNDR/USDT,DOGE/USDT,PEPE/USDT,AXS/USDT,SAND/USDT,IMX/USDT,GALA/USDT,NEAR/USDT,ATOM/USDT}'
      # Stop-loss monitor
      TRDEX_SL_CHECK_INTERVAL: '${TRDEX_SL_CHECK_INTERVAL:-30.0}'
      TRDEX_SL_POSITION_PCT: '${TRDEX_SL_POSITION_PCT:-0.03}'
      TRDEX_SL_TAKE_PROFIT_PCT: '${TRDEX_SL_TAKE_PROFIT_PCT:-0.05}'
      TRDEX_SL_TRAILING_STOP_PCT: '${TRDEX_SL_TRAILING_STOP_PCT:-0.02}'
      TRDEX_SL_DAILY_DRAWDOWN_PCT: '${TRDEX_SL_DAILY_DRAWDOWN_PCT:-0.10}'
      # Risk limits
      TRDEX_MAX_POSITION_PCT: '${TRDEX_MAX_POSITION_PCT:-0.05}'
      # Simulation gate (required before switching to live)
      TRDEX_GATE_MIN_DAYS: '${TRDEX_GATE_MIN_DAYS:-30}'
      TRDEX_GATE_MIN_SHARPE: '${TRDEX_GATE_MIN_SHARPE:-1.0}'
      TRDEX_GATE_MAX_DRAWDOWN: '${TRDEX_GATE_MAX_DRAWDOWN:-0.20}'
      TRDEX_GATE_MIN_WIN_RATE: '${TRDEX_GATE_MIN_WIN_RATE:-0.40}'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  # OAuth2 proxy — GitHub SSO for dashboard access.
  # Replaces the old basic-auth middleware (popup browser, no MFA,
  # hardcoded bcrypt hash in compose). Now the user logs in via
  # GitHub OAuth, and oauth2-proxy validates the session cookie on
  # every request before Traefik proxies to the Streamlit dashboard.
  #
  # Required Coolify env vars:
  #   OAUTH2_PROXY_CLIENT_ID      — GitHub OAuth App Client ID
  #   OAUTH2_PROXY_CLIENT_SECRET  — GitHub OAuth App Client Secret
  #   OAUTH2_PROXY_COOKIE_SECRET  — random 32-char string for cookie signing
  #   OAUTH2_PROXY_EMAIL_DOMAIN   — restrict to specific email domain (default: *)
  #   OAUTH2_PROXY_GITHUB_USER    — restrict to specific GitHub username
  # OAuth2 proxy — GitHub SSO for dashboard access.
  # Acts as a REVERSE PROXY in front of the dashboard: all /dashboard
  # traffic goes through oauth2-proxy, which handles login/redirect/
  # cookie verification internally. Traefik routes to oauth2-proxy,
  # NOT directly to the dashboard. oauth2-proxy then proxies to the
  # dashboard container on the internal Docker network.
  #
  # This is the "reverse proxy mode" (not forwardAuth mode). ForwardAuth
  # does not work well because Traefik passes 401s directly to the
  # client without redirecting to the login page.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    environment:
      OAUTH2_PROXY_PROVIDER: 'github'
      OAUTH2_PROXY_CLIENT_ID: '${OAUTH2_PROXY_CLIENT_ID}'
      OAUTH2_PROXY_CLIENT_SECRET: '${OAUTH2_PROXY_CLIENT_SECRET}'
      OAUTH2_PROXY_COOKIE_SECRET: '${OAUTH2_PROXY_COOKIE_SECRET}'
      OAUTH2_PROXY_COOKIE_SECURE: 'true'
      OAUTH2_PROXY_COOKIE_DOMAIN: 'trdex.gravya.it'
      OAUTH2_PROXY_COOKIE_PATH: '/'
      OAUTH2_PROXY_COOKIE_SAMESITE: 'lax'
      # Restrict access by email domain and/or GitHub username.
      # Defaults to * (any). Set via Coolify env vars to restrict:
      #   OAUTH2_PROXY_EMAIL_DOMAIN=gravya.it (or gmail.com, etc)
      #   OAUTH2_PROXY_GITHUB_USER=GravyaDev
      OAUTH2_PROXY_EMAIL_DOMAINS: '${OAUTH2_PROXY_EMAIL_DOMAIN:-*}'
      OAUTH2_PROXY_GITHUB_USERS: '${OAUTH2_PROXY_GITHUB_USER:-}'
      OAUTH2_PROXY_HTTP_ADDRESS: '0.0.0.0:4180'
      # Upstream: proxy authenticated requests to the dashboard container
      OAUTH2_PROXY_UPSTREAMS: 'http://dashboard:8501'
      OAUTH2_PROXY_REVERSE_PROXY: 'true'
      OAUTH2_PROXY_PROXY_PREFIX: '/oauth2'
      OAUTH2_PROXY_REDIRECT_URL: 'https://trdex.gravya.it/oauth2/callback'
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: 'true'
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      # Route ALL /dashboard and /oauth2 traffic to oauth2-proxy.
      # oauth2-proxy handles auth check, login redirect, and proxying
      # to the dashboard container internally.
      - "traefik.http.routers.trdex-dashboard.rule=Host(`trdex.gravya.it`) && (PathPrefix(`/dashboard`) || PathPrefix(`/oauth2`))"
      - "traefik.http.routers.trdex-dashboard.entrypoints=https"
      - "traefik.http.routers.trdex-dashboard.tls=true"
      - "traefik.http.routers.trdex-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.trdex-dashboard.service=trdex-oauth2-svc"
      - "traefik.http.services.trdex-oauth2-svc.loadbalancer.server.port=4180"

  # Streamlit dashboard — no direct Traefik route (proxied via oauth2-proxy).
  dashboard:
    build: .
    command: >
      uv run streamlit run src/trdex/dashboard/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.baseUrlPath=/dashboard
      --server.headless=true
      --browser.gatherUsageStats=false
    environment:
      TRDEX_DASHBOARD_API_URL: 'http://app:8000'
      TRDEX_DASHBOARD_API_KEY: '${TRDEX_API_KEY:-}'
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8501/dashboard/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  redis:
  qdrant:
