# documentation: https://github.com/GravyaDev/trdex
# slogan: AI-driven trading automation platform (scout, analyst, risk, executor)
# tags: trading,ai,langgraph,crypto,backtest,timescaledb,qdrant
# port: 8000

# Shared logging configuration — caps every container's log file at 10 MB
# with up to 3 rotated files, so a long-running unattended deploy on a
# small VPS disk does not silently fill the filesystem with stdout/stderr.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-trdex}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (openssl rand -hex 24)}'
      POSTGRES_DB: '${POSTGRES_DB:-trdex}'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trdex}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.13.0
    volumes:
      - qdrant:/qdrant/storage
    healthcheck:
      # The qdrant image has no curl/wget/nc. Bash is available though,
      # so we use the /dev/tcp bash trick to probe that port 6333 is
      # open. This doesn't check the /healthz endpoint body, but if
      # the TCP port is accepting connections qdrant is ready for
      # clients. CMD-SHELL default is /bin/sh (dash) which lacks
      # /dev/tcp support, so we force bash explicitly.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  app:
    build: .
    ports:
      - "${TRDEX_APP_HOST_PORT:-8500}:8000"
    environment:
      # App mode
      TRDEX_MODE: '${TRDEX_MODE:-simulation}'
      TRDEX_LOG_LEVEL: '${TRDEX_LOG_LEVEL:-INFO}'
      # Database (internal network, URL composed from POSTGRES_* vars)
      DATABASE_URL: 'postgresql+asyncpg://${POSTGRES_USER:-trdex}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trdex}'
      # Redis (internal network)
      REDIS_URL: 'redis://redis:6379/0'
      # Qdrant (internal network)
      TRDEX_QDRANT_URL: 'http://qdrant:6333'
      # FastAPI
      TRDEX_API_HOST: '0.0.0.0'
      TRDEX_API_PORT: '8000'
      # TRDEX_API_KEY: empty string is valid in dev mode (disables auth).
      # Use `?` (not `:?`) so Compose fails only if the variable is unset
      # in production Coolify — but tolerates the empty dev-locale value.
      TRDEX_API_KEY: '${TRDEX_API_KEY?TRDEX_API_KEY must be defined (can be empty in dev; generate with openssl rand -hex 32 for prod)}'
      TRDEX_CORS_ORIGINS: '${TRDEX_CORS_ORIGINS:-}'
      # Exchange (Binance) — optional in simulation mode
      BINANCE_API_KEY: '${BINANCE_API_KEY:-}'
      BINANCE_API_SECRET: '${BINANCE_API_SECRET:-}'
      # Market data aggregators — all optional
      TRDEX_COINGECKO_API_KEY: '${TRDEX_COINGECKO_API_KEY:-}'
      TRDEX_FOREX_API_KEY: '${TRDEX_FOREX_API_KEY:-}'
      TRDEX_CRYPTOCOMPARE_API_KEY: '${TRDEX_CRYPTOCOMPARE_API_KEY:-}'
      TRDEX_ALPHAVANTAGE_API_KEY: '${TRDEX_ALPHAVANTAGE_API_KEY:-}'
      TRDEX_FREECRYPTOAPI_KEY: '${TRDEX_FREECRYPTOAPI_KEY:-}'
      TRDEX_STOCKDATA_API_KEY: '${TRDEX_STOCKDATA_API_KEY:-}'
      # News ingestion
      TRDEX_INGESTION_INTERVAL: '${TRDEX_INGESTION_INTERVAL:-300}'
      TRDEX_INGESTION_SYMBOLS: '${TRDEX_INGESTION_SYMBOLS:-BTC/USDT,ETH/USDT}'
      # AI / embeddings (required for Qdrant context ingestion)
      # TRDEX_JINA_API_KEY: empty is tolerated (Qdrant embeddings feature
      # degrades but app still runs). `?` (not `:?`) for the same reason
      # as TRDEX_API_KEY: enforce definition in Coolify, tolerate empty dev.
      TRDEX_JINA_API_KEY: '${TRDEX_JINA_API_KEY?TRDEX_JINA_API_KEY must be defined (can be empty; enables Qdrant embeddings when set)}'
      # Telegram — disabled by default for Phase 2. A persistent volume
      # will be added when telegram signal tracking is re-enabled.
      TRDEX_TELEGRAM_API_ID: '${TRDEX_TELEGRAM_API_ID:-0}'
      TRDEX_TELEGRAM_API_HASH: '${TRDEX_TELEGRAM_API_HASH:-}'
      TRDEX_TELEGRAM_PHONE: '${TRDEX_TELEGRAM_PHONE:-}'
      TRDEX_TELEGRAM_CHANNELS: '${TRDEX_TELEGRAM_CHANNELS:-}'
      TRDEX_TELEGRAM_SIGNAL_BUDGET: '${TRDEX_TELEGRAM_SIGNAL_BUDGET:-100.0}'
      # Agent scheduler — Phase 2 observation (set true to enable)
      TRDEX_AGENT_SCHEDULER_ENABLED: '${TRDEX_AGENT_SCHEDULER_ENABLED:-false}'
      TRDEX_AGENT_SCHEDULER_INTERVAL: '${TRDEX_AGENT_SCHEDULER_INTERVAL:-300}'
      TRDEX_AGENT_SCHEDULER_SYMBOLS: '${TRDEX_AGENT_SCHEDULER_SYMBOLS:-BTC/USDT,ETH/USDT}'
      # Stop-loss monitor
      TRDEX_SL_CHECK_INTERVAL: '${TRDEX_SL_CHECK_INTERVAL:-30.0}'
      TRDEX_SL_POSITION_PCT: '${TRDEX_SL_POSITION_PCT:-0.05}'
      TRDEX_SL_TAKE_PROFIT_PCT: '${TRDEX_SL_TAKE_PROFIT_PCT:-0.10}'
      TRDEX_SL_TRAILING_STOP_PCT: '${TRDEX_SL_TRAILING_STOP_PCT:-0.03}'
      TRDEX_SL_DAILY_DRAWDOWN_PCT: '${TRDEX_SL_DAILY_DRAWDOWN_PCT:-0.10}'
      # Risk limits
      TRDEX_MAX_POSITION_PCT: '${TRDEX_MAX_POSITION_PCT:-0.02}'
      # Simulation gate (required before switching to live)
      TRDEX_GATE_MIN_DAYS: '${TRDEX_GATE_MIN_DAYS:-30}'
      TRDEX_GATE_MIN_SHARPE: '${TRDEX_GATE_MIN_SHARPE:-1.0}'
      TRDEX_GATE_MAX_DRAWDOWN: '${TRDEX_GATE_MAX_DRAWDOWN:-0.20}'
      TRDEX_GATE_MIN_WIN_RATE: '${TRDEX_GATE_MIN_WIN_RATE:-0.40}'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  # Streamlit dashboard UI for Phase 2 observation.
  #
  # Reuses the trdex-app image (same build context) because streamlit
  # and plotly are already declared in pyproject.toml — no new Dockerfile
  # needed. The CMD is overridden to run Streamlit instead of uvicorn.
  #
  # Served at https://trdex.gravya.it/dashboard behind Traefik with
  # basic-auth middleware (credentials in TRDEX_DASHBOARD_BASICAUTH env
  # var, generated with htpasswd -nb). Talks to the FastAPI app over
  # the internal Docker network (http://app:8000), so the API key the
  # user pastes into the sidebar is the only auth towards the backend.
  #
  # See Task Board "Upgrade auth dashboard" for the follow-up plan to
  # replace basic-auth with Cloudflare Access or Tailscale.
  dashboard:
    build: .
    command: >
      uv run streamlit run src/trdex/dashboard/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.baseUrlPath=/dashboard
      --server.headless=true
      --browser.gatherUsageStats=false
    environment:
      # Pre-fill the dashboard's sidebar inputs so the operator doesn't
      # have to paste values on every session. Both are overridable via
      # the sidebar if needed.
      TRDEX_DASHBOARD_API_URL: 'http://app:8000'
      TRDEX_DASHBOARD_API_KEY: '${TRDEX_API_KEY:-}'
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # Streamlit exposes its health endpoint under the configured
      # baseUrlPath, so with --server.baseUrlPath=/dashboard the URL
      # becomes /dashboard/_stcore/health. curl is already installed
      # in the base image (Bug 2 fix, commit c42c641).
      test: ["CMD-SHELL", "curl -sf http://localhost:8501/dashboard/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    labels:
      # Traefik routing for Coolify. The main Application in Coolify
      # already generates Host(`trdex.gravya.it`) -> app:8000; this
      # second router is more specific (Host + PathPrefix) so Traefik
      # routes /dashboard/* to the Streamlit container and everything
      # else stays on the FastAPI app.
      - "traefik.enable=true"
      - "traefik.http.routers.trdex-dashboard.rule=Host(`trdex.gravya.it`) && PathPrefix(`/dashboard`)"
      - "traefik.http.routers.trdex-dashboard.entrypoints=https"
      - "traefik.http.routers.trdex-dashboard.tls=true"
      - "traefik.http.routers.trdex-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.trdex-dashboard.service=trdex-dashboard"
      - "traefik.http.services.trdex-dashboard.loadbalancer.server.port=8501"
      # Basic-auth middleware — hash is hardcoded per Coolify official
      # pattern (https://coolify.io/docs/knowledge-base/proxy/traefik/basic-auth).
      # Single quotes around the label value mean YAML treats the string
      # as literal and docker-compose does NOT interpolate $VAR, so the
      # bcrypt dollars stay as single `$` (not `$$`). Tried referencing
      # via ${TRDEX_DASHBOARD_BASICAUTH} env var first but Coolify does
      # not interpolate env vars inside Traefik labels at compose-up
      # time — the literal `${...}` ended up on the container, Traefik
      # rejected it, 401 forever. Hardcoded works.
      #
      # The hash is bcrypt ($2y$) of a 24-char random password; offline
      # brute force is infeasible. Repo is private. Upgrade path is
      # tracked in Task Board "Upgrade auth dashboard" (Cloudflare
      # Access / Tailscale / oauth2-proxy) and should happen before
      # any move to live mode.
      #
      # To rotate: regenerate with
      #   docker run --rm httpd:2.4-alpine htpasswd -nbB <user> <pass>
      # paste the output here verbatim (single $), commit, redeploy.
      - 'traefik.http.routers.trdex-dashboard.middlewares=trdex-dashboard-auth'
      - 'traefik.http.middlewares.trdex-dashboard-auth.basicauth.users=daniele:$2y$05$kB33xiQMcnxh25vJra3iVuuj/0UeRdhEKMC3KARtETCfB3gLUJeR6'
      - 'traefik.http.middlewares.trdex-dashboard-auth.basicauth.realm=trdex'

volumes:
  pgdata:
  redis:
  qdrant:
